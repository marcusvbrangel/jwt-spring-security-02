spring.application.name=jwt-spring-security-02

# Datasource PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jwt_db
spring.datasource.username=jwt_user
spring.datasource.password=jwt_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=um-segredo-super-seguro-para-jwt-2025
jwt.expiration=3600000

# Swagger
# Remover customizações para usar os padrões
#springdoc.api-docs.path=/v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html

# Outras configs
server.error.include-message=always
logging.level.org.springframework.security=INFO
logging.level.com.mvbr=DEBUG
